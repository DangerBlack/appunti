name: Release

# Push a tag like v0.7.0 (matching versionName in app/build.gradle.kts)
# to build a signed APK and publish it as a GitHub release. The signed App Bundle
# for Google Play is attached to the workflow run as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Fetch sherpa-onnx
        run: scripts/fetch-deps.sh

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "APPUNTI_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build and sign release APK and App Bundle
        env:
          APPUNTI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APPUNTI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease -Punsigned
          scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/app-release.apk"
          scripts/sign-bundle.sh app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/app-release.aab"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Appunti-$VERSION.apk"
          cp "$RUNNER_TEMP/app-release.apk" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Appunti $VERSION" --generate-notes

      - name: Upload App Bundle for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: appunti-aab
          path: ${{ runner.temp }}/app-release.aab

      - name: Upload APK (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: appunti-apk
          path: ${{ runner.temp }}/app-release.apk
